# /etc/systemd/logind.conf.d/10-never-idle.conf
#
# This box runs long headless jobs. It must never go to sleep because nobody
# touched it. The screen may blank (that is DPMS, handled by the desktop); the
# processes must keep running.
#
# ignore is logind's default today. It is pinned here so a package update or a
# stray edit cannot turn idle-sleep on. The ONLY sleep this box should ever do
# is hibernate, and only for a power outage (hibernate-governor, the park
# guard) or when asked (the dashboard's Hibernate button). Suspend is masked
# outright -- see docs/INSTALL.md.
[Login]
IdleAction=ignore
