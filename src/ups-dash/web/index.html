<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0b">
<title>Power Sentinel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9889;</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/controls.css">
</head>
<body data-state="nominal">
  <div id="app">
    <header class="topbar">
      <span class="dot" id="link" title="live"></span>
      <h1>Power Sentinel</h1>
      <span class="spacer"></span>
      <button id="install" type="button" class="hidden">INSTALL</button>
      <button id="theme" type="button">DARK</button>
    </header>

    <nav class="tabs" role="tablist">
      <button id="tab-now"     role="tab" aria-selected="true">Now</button>
      <button id="tab-history" role="tab" aria-selected="false">History</button>
      <button id="tab-health"  role="tab" aria-selected="false">Health</button>
      <button id="tab-config"  role="tab" aria-selected="false">Config</button>
    </nav>

    <div id="offline" class="offlinebar hidden" role="status" aria-live="polite"></div>

    <main id="view"><div class="empty">connecting…</div></main>
  </div>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
