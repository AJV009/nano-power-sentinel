# Resilience drop-in for the UPS power chain.
#
# StartLimitIntervalSec=0 disables systemd's start-rate limiting entirely.
# The default (5 starts in 10s, then GIVE UP PERMANENTLY) is wrong for every
# unit in this chain: a service whose whole job is to still be running when
# everything else has failed must never stop trying. A transient crash loop
# during a power event would otherwise leave the protection silently dead
# with no further attempts and no alert.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10s
